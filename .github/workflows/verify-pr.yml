name: verify-pr

# Independent check of a claimed fix, using the SAME script the nightly harness runs:
#   ops/verify-claim.sh  ->  exit 0 only if the test passes with the fix and fails without it.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo"
        type: string
        required: true
      pr_url:
        description: "Pull request URL"
        type: string
        required: true
      test_path:
        description: "Test file that proves the defect"
        type: string
        required: true
      fixed_file:
        description: "Source file the fix changed"
        type: string
        required: true
      base:
        description: "Base branch"
        type: string
        default: "master"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the claim
        env:
          GH_TOKEN: ${{ secrets.OSS_SCOUT_WRITE_TOKEN }}
          REPO: ${{ inputs.repo }}
          PR_URL: ${{ inputs.pr_url }}
          TEST_PATH: ${{ inputs.test_path }}
          FIXED_FILE: ${{ inputs.fixed_file }}
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          bash ops/verify-claim.sh "$REPO" "$PR_URL" "$TEST_PATH" "$FIXED_FILE" "$BASE"
