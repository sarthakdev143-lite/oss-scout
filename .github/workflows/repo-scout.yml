name: repo-scout

# Ranks candidate repos by the only metric that matters for both volume and reputation:
# how often OUTSIDE contributors' PRs actually get merged. Volume follows merge rate, not effort.
# Logic lives in ops/repo-scout.py so it can be tested and read as code, not YAML.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "space-separated owner/repo list (blank = built-in candidate set)"
        type: string
        default: ""
      since_days:
        description: "look-back window"
        type: string
        default: "90"
      discover:
        description: "build the list from repos with live labeled issues instead of the built-in set"
        type: boolean
        default: false
      min_stars:
        description: "minimum stars when discovering"
        type: string
        default: "200"

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rank repos
        env:
          GH_TOKEN: ${{ secrets.OSS_SCOUT_WRITE_TOKEN }}
          REPOS: ${{ inputs.repos }}
          SINCE_DAYS: ${{ inputs.since_days }}
          DISCOVER: ${{ inputs.discover && '1' || '0' }}
          MIN_STARS: ${{ inputs.min_stars }}
        run: |
          set -uo pipefail
          ARGS=(--since-days "$SINCE_DAYS" --summary "$GITHUB_STEP_SUMMARY" --min-stars "$MIN_STARS")
          if [ "$DISCOVER" = "1" ]; then
            ARGS+=(--discover)
          else
            ARGS+=(--repos "$REPOS")
          fi
          python3 ops/repo-scout.py "${ARGS[@]}"
